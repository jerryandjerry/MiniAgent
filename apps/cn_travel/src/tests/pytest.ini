[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    rag: needs the packaged vector index, embedding model, and local RAG dependencies
    amap: needs network access to AMap
    live: needs DASHSCOPE_API_KEY (costs money)
    model: needs torch + complete local Qwen3.5-0.8B weights
    policy: needs the configured policy inference endpoint
    reviews: explicitly enables the live hotel-review integration
    slow: takes >10s
